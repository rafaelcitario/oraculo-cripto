plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oraculo'
    compileSdk 35

    defaultConfig {
        applicationId "com.oraculo.cripto"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sem dependências externas de propósito: só o SDK do Android.
dependencies {
}
